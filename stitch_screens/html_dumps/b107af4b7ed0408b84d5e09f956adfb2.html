<!DOCTYPE html>

<html class="light" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>家教中心 - 編輯耗材品項</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Noto+Sans+TC:wght@100..900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13b6ec",
                        "primary-dark": "#0ea5d6",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101d22",
                        "surface-dark": "#1a2c33",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans TC", "sans-serif"],
                        "body": ["Noto Sans TC", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark transition-colors duration-200 font-display text-[#111618] dark:text-gray-100">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f0f3f4] dark:border-gray-800 bg-white dark:bg-surface-dark px-10 py-3 sticky top-0 z-50 shadow-sm">
<div class="flex items-center gap-4">
<div class="size-8 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl">dentistry</span>
</div>
<h2 class="text-[#111618] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">家教中心管理後台</h2>
</div>
<div class="flex flex-1 justify-end gap-8">
<div class="hidden md:flex items-center gap-9">
<a class="text-[#617f89] dark:text-gray-400 text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">課程管理</a>
<a class="text-[#111618] dark:text-white text-sm font-medium leading-normal border-b-2 border-primary pb-0.5" href="#">耗材管理</a>
<a class="text-[#617f89] dark:text-gray-400 text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">學生資料</a>
<a class="text-[#617f89] dark:text-gray-400 text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">系統設定</a>
</div>
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10 ring-2 ring-gray-100 dark:ring-gray-700 cursor-pointer" data-alt="Portrait of the logged in female teacher" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDdxSP31K96ZWzTDRnvBxd_qLYuwsws1ei0P6oPbEAVHQMEJN5MEt3N_oN2MnYUTk4vGhwH49niuz62nMYnJBNIZZaLKIoSMt-8U2puIqEUVQ7JXsP-d18olOkp9TGXlMTsdZ1Nl9HacnNxhl0YaGoYkTTlpfHfNiOHWlckoYm8ceeqyfRjEy7nwafDwFmvMn6lpJ6NMndW4-GkICX8wK42NIc-Fw0UYvNxXIvuWRetjTM3m8xNmJUh1qiFzkqXAaELvKctoFAht7A");'>
</div>
</div>
</header>
<main class="layout-container flex h-full grow flex-col">
<div class="px-4 md:px-40 flex flex-1 justify-center py-8">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1">
<!-- Breadcrumbs -->
<nav class="flex flex-wrap gap-2 px-4 mb-2">
<a class="text-[#617f89] dark:text-gray-400 text-sm font-medium leading-normal hover:underline" href="#">首頁</a>
<span class="text-[#617f89] dark:text-gray-400 text-sm font-medium leading-normal">/</span>
<a class="text-[#617f89] dark:text-gray-400 text-sm font-medium leading-normal hover:underline" href="#">耗材管理</a>
<span class="text-[#617f89] dark:text-gray-400 text-sm font-medium leading-normal">/</span>
<span class="text-[#111618] dark:text-white text-sm font-medium leading-normal">編輯品項</span>
</nav>
<!-- Page Heading -->
<div class="flex flex-wrap justify-between items-end gap-3 px-4 pb-6">
<div class="flex min-w-72 flex-col gap-2">
<h1 class="text-[#111618] dark:text-white text-3xl md:text-4xl font-bold leading-tight tracking-[-0.033em]">編輯耗材品項</h1>
<p class="text-[#617f89] dark:text-gray-400 text-base font-normal leading-normal">修改品項資訊、價格及更新上架狀態</p>
</div>
</div>
<!-- Main Form Card -->
<div class="mx-4 bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-[#f0f3f4] dark:border-gray-800 p-6 md:p-8">
<!-- Form Section 1: Basic Info -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
<!-- Item Name -->
<div class="flex flex-col gap-2 md:col-span-2">
<label class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal" for="item-name">品項名稱</label>
<input class="form-input flex w-full rounded-lg border border-[#dbe3e6] dark:border-gray-600 bg-white dark:bg-surface-dark text-[#111618] dark:text-white h-12 px-4 text-base focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-[#617f89]" id="item-name" type="text" value="紅色雕刻蠟塊 (標準型)"/>
</div>
<!-- Price -->
<div class="flex flex-col gap-2">
<label class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal" for="price">參考售價 (NTD)</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="text-gray-500 text-sm">$</span>
</div>
<input class="form-input flex w-full rounded-lg border border-[#dbe3e6] dark:border-gray-600 bg-white dark:bg-surface-dark text-[#111618] dark:text-white h-12 pl-8 pr-4 text-base focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-[#617f89]" id="price" type="number" value="150"/>
</div>
</div>
<!-- Shopee Link -->
<div class="flex flex-col gap-2 md:col-span-2">
<label class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal flex items-center gap-2" for="shopee-link">
                                    蝦皮購買連結
                                    <span class="bg-orange-100 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400 text-xs px-2 py-0.5 rounded-full font-normal">Shopee</span>
</label>
<div class="flex gap-2">
<input class="form-input flex-1 rounded-lg border border-[#dbe3e6] dark:border-gray-600 bg-white dark:bg-surface-dark text-[#111618] dark:text-white h-12 px-4 text-base focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-[#617f89]" id="shopee-link" type="url" value="https://shopee.tw/product/12345678/99887766"/>
<a class="flex items-center justify-center size-12 rounded-lg border border-[#dbe3e6] dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-[#617f89] dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-primary transition-colors" href="#" target="_blank" title="測試連結">
<span class="material-symbols-outlined text-xl">open_in_new</span>
</a>
</div>
<p class="text-xs text-[#617f89] dark:text-gray-500 mt-1">請確保連結有效，以便學生直接購買。</p>
</div>
</div>
<hr class="border-[#f0f3f4] dark:border-gray-700 my-8"/>
<!-- Form Section 2: Status -->
<div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
<div class="flex flex-col gap-1">
<h3 class="text-[#111618] dark:text-white text-base font-bold">上架狀態</h3>
<p class="text-[#617f89] dark:text-gray-400 text-sm">設定學生是否可見此耗材品項。下架後，學生將無法查看或購買。</p>
</div>
<label class="inline-flex items-center cursor-pointer group">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="relative w-14 h-8 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
<span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300 group-hover:text-primary transition-colors">已上架</span>
</label>
</div>
</div>
<!-- Action Buttons -->
<div class="flex justify-end gap-4 px-4 py-6 mt-2">
<button class="px-6 py-3 rounded-lg border border-[#dbe3e6] dark:border-gray-600 text-[#111618] dark:text-white bg-white dark:bg-transparent text-sm font-bold hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                            取消
                        </button>
<button class="px-8 py-3 rounded-lg bg-primary hover:bg-primary-dark text-white text-sm font-bold shadow-md shadow-primary/20 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-lg">save</span>
                            儲存更改
                        </button>
</div>
</div>
</div>
</main>
</div>
</body></html>
