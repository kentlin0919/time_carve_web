<!DOCTYPE html>

<html class="light" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>家教中心 - Email 驗證</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13b6ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101d22",
                        "surface-light": "#ffffff",
                        "surface-dark": "#18282e",
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans TC", "sans-serif"],
                        "body": ["Inter", "Noto Sans TC", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom styles to remove spinner from number inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#111618] dark:text-gray-100 font-display transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-gray-200 dark:border-gray-800 bg-surface-light dark:bg-surface-dark px-6 py-4 lg:px-10">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center rounded-full size-10 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-[#111618] dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col">
<h2 class="text-lg font-bold leading-tight tracking-tight text-[#111618] dark:text-white">家教中心</h2>
<span class="text-xs font-medium text-gray-500 dark:text-gray-400">牙體技術培訓系統</span>
</div>
</div>
<div class="hidden sm:flex items-center gap-2">
<div class="size-8 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-sm">person</span>
</div>
<span class="text-sm font-medium text-gray-600 dark:text-gray-300">訪客</span>
</div>
</header>
<!-- Main Content -->
<main class="flex flex-1 flex-col items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8 bg-surface-light dark:bg-surface-dark p-8 shadow-xl dark:shadow-none rounded-2xl border border-gray-100 dark:border-gray-800">
<!-- Icon/Illustration -->
<div class="flex justify-center">
<div class="relative flex items-center justify-center size-20 rounded-full bg-primary/10 dark:bg-primary/20">
<span class="material-symbols-outlined text-4xl text-primary">mark_email_read</span>
<div class="absolute -bottom-1 -right-1 size-8 rounded-full bg-surface-light dark:bg-surface-dark flex items-center justify-center border-2 border-white dark:border-[#18282e]">
<span class="material-symbols-outlined text-sm text-green-500">check_circle</span>
</div>
</div>
</div>
<!-- Headings -->
<div class="text-center">
<h2 class="mt-2 text-2xl font-bold tracking-tight text-[#111618] dark:text-white">輸入驗證碼</h2>
<p class="mt-3 text-sm text-gray-500 dark:text-gray-400 leading-relaxed">
                        我們已發送 6 位數驗證碼至 <span class="font-semibold text-[#111618] dark:text-gray-200">student@example.com</span>。<br/>請查收信件並在下方輸入。
                    </p>
</div>
<!-- OTP Input Grid -->
<div class="mt-8">
<form action="#" class="space-y-6" method="POST">
<div class="flex justify-center gap-2 sm:gap-3">
<input autofocus="" class="flex h-12 w-10 sm:h-14 sm:w-12 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-center text-xl sm:text-2xl font-semibold text-[#111618] dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="\d*" type="text" value="4"/>
<input class="flex h-12 w-10 sm:h-14 sm:w-12 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-center text-xl sm:text-2xl font-semibold text-[#111618] dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="\d*" type="text" value="9"/>
<input class="flex h-12 w-10 sm:h-14 sm:w-12 rounded-lg border-2 border-primary ring-2 ring-primary/20 bg-white dark:bg-gray-800 text-center text-xl sm:text-2xl font-semibold text-[#111618] dark:text-white focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="\d*" placeholder="-" type="text"/>
<input class="flex h-12 w-10 sm:h-14 sm:w-12 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-center text-xl sm:text-2xl font-semibold text-[#111618] dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input class="flex h-12 w-10 sm:h-14 sm:w-12 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-center text-xl sm:text-2xl font-semibold text-[#111618] dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input class="flex h-12 w-10 sm:h-14 sm:w-12 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 text-center text-xl sm:text-2xl font-semibold text-[#111618] dark:text-white focus:border-primary focus:ring-2 focus:ring-primary/50 focus:outline-none transition-all shadow-sm" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
</div>
<!-- Error Message Example (Hidden by default, shown for design context) -->
<div class="hidden flex items-center justify-center gap-2 text-red-500 text-sm animate-pulse">
<span class="material-symbols-outlined text-base">error</span>
<span>驗證碼錯誤，請重試</span>
</div>
<!-- Timer & Resend -->
<div class="flex flex-col items-center justify-center gap-2 pt-2">
<div class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400">
<span class="material-symbols-outlined text-lg">timer</span>
<span>驗證碼有效期剩餘 <span class="font-mono font-medium text-[#111618] dark:text-gray-200">04:59</span></span>
</div>
<div class="flex items-center gap-1 text-sm">
<span class="text-gray-500 dark:text-gray-400">沒收到驗證碼？</span>
<button class="font-semibold text-gray-400 cursor-not-allowed" disabled="" type="button">
                                    重新發送 (59s)
                                </button>
<!-- Active state example:
                                <button type="button" class="font-semibold text-primary hover:text-primary/80 transition-colors">
                                    重新發送
                                </button> 
                                -->
</div>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 bg-primary hover:bg-[#0fa4d6] text-white text-base font-bold leading-normal tracking-[0.015em] transition-all shadow-lg shadow-primary/30 active:scale-[0.98]" type="button">
<span class="truncate">驗證</span>
</button>
</div>
</form>
</div>
</div>
<!-- Footer Help Link -->
<div class="mt-8 text-center">
<a class="text-sm text-gray-500 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-base">help</span>
                    遇到問題？聯繫客服
                </a>
</div>
</main>
</div>
</body></html>
