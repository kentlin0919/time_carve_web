<!DOCTYPE html>
<html class="light" lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TimeCarve 刻時 - 重設密碼</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Noto+Sans+TC:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#87CEFA", // Sky Blue based on logo description
                        "primary-dark": "#0fa0d1",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101d22",
                    },
                    fontFamily: {
                        "display": ["Lexend", "Noto Sans TC", "sans-serif"],
                        "sans": ["Lexend", "Noto Sans TC", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#111618] dark:text-white font-display antialiased selection:bg-primary/20">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f0f3f4] dark:border-b-gray-800 px-6 lg:px-10 py-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
<div class="flex items-center gap-4 text-[#111618] dark:text-white">
<div class="h-8 w-auto text-primary">
<svg class="h-full w-auto" fill="none" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
<path d="M10 50 C 30 40, 60 10, 90 5" stroke="#87CEFA" stroke-linecap="round" stroke-width="4"></path>
<path d="M50 50 C 55 40, 65 30, 75 25" fill="#f0f0f0"></path>
</svg>
</div>
<h2 class="text-[#111618] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">TimeCarve 刻時</h2>
</div>
<div class="flex flex-1 justify-end gap-8">
<div class="hidden lg:flex items-center gap-9">
<a class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">首頁</a>
<a class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">課程列表</a>
<a class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">師資介紹</a>
<a class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">學員心得</a>
<a class="text-[#111618] dark:text-gray-200 text-sm font-medium leading-normal hover:text-primary transition-colors" href="#">聯絡我們</a>
</div>
<div class="flex gap-4 items-center">
<button class="lg:hidden text-[#111618] dark:text-white">
<span class="material-symbols-outlined">menu</span>
</button>
<button class="hidden lg:flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-10 px-6 bg-primary hover:bg-primary-dark transition-colors text-white text-sm font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20">
<span class="truncate">登入 / 註冊</span>
</button>
</div>
</div>
</header>
<div class="layout-container flex h-full grow flex-col relative z-0">
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute top-[10%] left-[20%] w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-[10%] right-[20%] w-80 h-80 bg-purple-500/5 rounded-full blur-3xl"></div>
</div>
<div class="px-4 flex flex-1 items-center justify-center py-12 md:py-20">
<div class="w-full max-w-[480px] bg-white dark:bg-gray-800 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none border border-slate-100 dark:border-gray-700 p-8 md:p-12 relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-purple-300"></div>
<div class="flex flex-col items-center text-center mb-8">
<div class="size-16 rounded-2xl bg-primary/10 flex items-center justify-center text-primary mb-6 shadow-sm ring-1 ring-primary/20">
<span class="material-symbols-outlined text-[32px]">lock_reset</span>
</div>
<h2 class="text-2xl md:text-3xl font-black text-[#111618] dark:text-white tracking-tight mb-3">重設密碼</h2>
<p class="text-[#617f89] dark:text-gray-400 text-sm leading-relaxed max-w-xs">
                            請輸入您的新密碼並確認。為了您的帳號安全，建議使用包含字母、數字和符號的強密碼組合。
                        </p>
</div>
<form action="#" class="space-y-6" method="POST">
<div class="space-y-5">
<div class="space-y-2 text-left">
<label class="text-sm font-bold text-[#111618] dark:text-gray-200 ml-1" for="new_password">新密碼</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full rounded-xl border-slate-200 dark:border-gray-700 bg-slate-50 dark:bg-gray-900 py-3.5 pl-11 pr-12 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary sm:text-sm transition-shadow outline-none" id="new_password" name="new_password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="pt-1 px-1">
<div class="flex gap-1.5 h-1.5 mb-2 rounded-full overflow-hidden bg-slate-100 dark:bg-gray-800">
<div class="w-1/4 h-full bg-primary/60"></div>
<div class="w-1/4 h-full bg-slate-200 dark:bg-gray-700"></div>
<div class="w-1/4 h-full bg-slate-200 dark:bg-gray-700"></div>
<div class="w-1/4 h-full bg-slate-200 dark:bg-gray-700"></div>
</div>
<ul class="mt-2 space-y-1.5 text-xs text-slate-500 dark:text-gray-400">
<li class="flex items-center gap-2 text-emerald-500 font-medium">
<span class="material-symbols-outlined text-[16px]">check_circle</span>
<span class="text-slate-700 dark:text-gray-300">至少 8 個字元</span>
</li>
<li class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-slate-300">radio_button_unchecked</span>
<span>包含大寫字母</span>
</li>
<li class="flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-slate-300">radio_button_unchecked</span>
<span>包含數字或特殊符號</span>
</li>
</ul>
</div>
</div>
<div class="space-y-2 text-left">
<label class="text-sm font-bold text-[#111618] dark:text-gray-200 ml-1" for="confirm_password">確認新密碼</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">verified_user</span>
</div>
<input class="block w-full rounded-xl border-slate-200 dark:border-gray-700 bg-slate-50 dark:bg-gray-900 py-3.5 pl-11 pr-4 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-primary sm:text-sm transition-shadow outline-none" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
</div>
<button class="w-full flex items-center justify-center gap-2 rounded-xl bg-primary hover:bg-primary-dark text-white py-3.5 px-4 text-sm font-bold shadow-lg shadow-primary/25 transition-all hover:-translate-y-0.5 active:translate-y-0" type="submit">
                            完成設定
                        </button>
</form>
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-gray-700/50 text-center">
<a class="inline-flex items-center gap-2 text-sm font-bold text-slate-500 dark:text-gray-400 hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                            返回登入
                        </a>
</div>
</div>
</div>
</div>
<footer class="bg-white dark:bg-gray-900 border-t border-[#f0f3f4] dark:border-gray-800 py-10 px-6 lg:px-40">
<div class="flex flex-col md:flex-row justify-between items-center gap-6">
<div class="flex items-center gap-2">
<div class="h-6 w-auto text-primary">
<svg class="h-full w-auto" fill="none" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
<path d="M10 50 C 30 40, 60 10, 90 5" stroke="#87CEFA" stroke-linecap="round" stroke-width="4"></path>
<path d="M50 50 C 55 40, 65 30, 75 25" fill="#f0f0f0"></path>
</svg>
</div>
<p class="text-[#617f89] dark:text-gray-500 text-sm">© 2023 TimeCarve 刻時. All rights reserved.</p>
</div>
<div class="flex gap-6">
<a class="text-[#617f89] dark:text-gray-500 hover:text-primary transition-colors text-sm font-medium" href="#">隱私權政策</a>
<a class="text-[#617f89] dark:text-gray-500 hover:text-primary transition-colors text-sm font-medium" href="#">服務條款</a>
<a class="text-[#617f89] dark:text-gray-500 hover:text-primary transition-colors text-sm font-medium" href="#">常見問題</a>
</div>
</div>
</footer>
</div>
</body></html>
